<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Potential — Reframe Post</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="post.css">
<link rel="stylesheet" href="../compass.css">
<style>
  .p2{background:var(--grad-night)}
  .p2 .glow{position:absolute;top:-220px;right:-220px;width:760px;height:760px;border-radius:50%;
    background:radial-gradient(circle, rgba(226,181,107,.30) 0%, rgba(138,94,46,.12) 40%, transparent 68%);filter:blur(4px)}
  .p2 .kicker{position:absolute;top:104px;left:104px;font-size:21px;color:var(--gold-500)}
  .p2 .head{position:absolute;top:300px;left:104px;right:120px;font-size:96px;line-height:1.02;letter-spacing:-.015em;color:var(--ivory)}
  .p2 .head em{font-style:italic;color:var(--gold-500)}
  .p2 .rule{position:absolute;left:104px;top:792px;width:96px;height:2px;background:var(--gold-500)}
  .p2 .sub{position:absolute;left:104px;top:836px;right:160px;font-size:30px;line-height:1.45;color:var(--ivory-dim);font-weight:400}
  .p2 .wm{position:absolute;left:104px;bottom:100px;font-size:40px}
  .p2 .mark{position:absolute;right:104px;bottom:84px}
</style>
</head>
<body>
<div class="stage">
  <div class="post sq p2">
    <div class="glow"></div>
    <div class="kicker mono">The question no one asks you</div>
    <h1 class="head serif">You chose your<br>career. Your friends.<br>Your whole life.<br>Why not the <em>place?</em></h1>
    <div class="rule"></div>
    <p class="sub">Most people inherit where they live. Potential helps you actually choose it.</p>
    <div class="wm">Potential</div>
    <span class="mark compass" data-compass="76"></span>
    <div class="grain"></div>
  </div>
</div>
<script src="../compass.js"></script>
<script src="post.js"></script>
</body>
</html>
