<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Potential — Match Teaser</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="post.css">
<link rel="stylesheet" href="../compass.css">
<style>
  .p4{background:var(--grad-night)}
  .p4 .top{position:absolute;top:96px;left:104px;right:104px;display:flex;justify-content:space-between;align-items:center}
  .p4 .top .wm{font-size:34px}
  .p4 .top .k{font-size:18px;color:var(--gold-500)}
  .p4 .card{position:absolute;left:104px;right:104px;top:196px;border:1px solid var(--ivory-ghost);border-radius:28px;overflow:hidden;background:var(--night-700)}
  .p4 .sky{height:230px;position:relative;background:radial-gradient(90% 150% at 50% 100%, var(--gold-700) 0%, #6E4F2A 26%, var(--amber-deep) 52%, #14110c 86%)}
  .p4 .sky .sun{position:absolute;left:78px;bottom:-46px;width:92px;height:92px}
  .p4 .sky .loc{position:absolute;left:200px;bottom:34px;font-family:var(--font-display);font-size:64px;color:var(--ivory);line-height:1}
  .p4 .sky .ctry{position:absolute;left:202px;bottom:18px;font-family:var(--font-mono);font-size:18px;letter-spacing:.18em;text-transform:uppercase;color:rgba(243,237,225,.7)}
  .p4 .score{position:absolute;right:44px;top:44px;text-align:right}
  .p4 .score .num{font-family:var(--font-display);font-size:104px;line-height:.8;color:var(--ivory)}
  .p4 .score .lab{font-family:var(--font-mono);font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:rgba(243,237,225,.8)}
  .p4 .body{padding:44px 56px 8px}
  .p4 .stat{display:flex;justify-content:space-between;align-items:baseline;padding:26px 0;border-bottom:1px solid var(--ivory-ghost)}
  .p4 .stat .l{font-size:27px;color:var(--ivory-dim)}
  .p4 .stat .v{font-family:var(--font-mono);font-size:32px;color:var(--ivory)}
  .p4 .stat .v.pos{color:var(--positive)}
  .p4 .tags{display:flex;gap:14px;padding:34px 0 4px;flex-wrap:wrap}
  .p4 .tag{font-family:var(--font-mono);font-size:18px;letter-spacing:.06em;color:var(--gold-500);border:1px solid color-mix(in srgb,var(--gold-500) 36%,transparent);border-radius:100px;padding:10px 20px}
  .p4 .cta{position:absolute;left:104px;right:104px;bottom:76px;display:flex;justify-content:space-between;align-items:center}
  .p4 .cta .t{font-family:var(--font-display);font-size:34px;color:var(--ivory)}
  .p4 .cta .b{font-family:var(--font-mono);font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:var(--night-800);background:var(--gold-500);padding:16px 28px;border-radius:100px}
</style>
</head>
<body>
<div class="stage">
  <div class="post sq p4">
    <div class="top">
      <div class="wm" style="gap:13px"><span class="compass" data-compass="40"></span>Potential</div>
      <div class="k mono">Sample result</div>
    </div>
    <div class="card">
      <div class="sky">
        <span class="sun compass" data-compass="92"></span>
        <div class="ctry">Portugal</div>
        <div class="loc">Lisbon</div>
        <div class="score"><div class="num">94</div><div class="lab">Match</div></div>
      </div>
      <div class="body">
        <div class="stat"><span class="l">Take-home / month</span><span class="v">$4,120</span></div>
        <div class="stat"><span class="l">Rent · 1 bedroom</span><span class="v">$1,180</span></div>
        <div class="stat"><span class="l">Left over to save</span><span class="v pos">+$1,540</span></div>
        <div class="tags">
          <span class="tag">Coastal</span>
          <span class="tag">English-friendly</span>
          <span class="tag">D7 visa path</span>
        </div>
      </div>
    </div>
    <div class="cta">
      <div class="t serif">This could be your year one.</div>
      <div class="b">Unlock roadmap</div>
    </div>
    <div class="grain"></div>
  </div>
</div>
<script src="../compass.js"></script>
<script src="post.js"></script>
</body>
</html>
